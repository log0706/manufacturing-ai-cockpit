name: verify

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref makes an in-flight run obsolete.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint, typecheck, audits, build, browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (lint, typecheck, content + i18n audits, build)
        run: npm run verify

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npm run test:browser
